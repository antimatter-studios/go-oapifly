name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23", "1.24", "1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./... -v

  example-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install the pinned Vertrag executable
        env:
          VERTRAG_VERSION: 0.30.0
          VERTRAG_SHA256: 1e351abf1ae4e43b839072a92daa50e2aac5247f4e6c3198e238a19d2357ea5d
        run: |
          set -euo pipefail
          asset="vertrag-${VERTRAG_VERSION}-linux-x86_64.tar.gz"
          curl --location --silent --show-error --fail \
            "https://github.com/antimatter-studios/vertrag/releases/download/v${VERTRAG_VERSION}/${asset}" \
            -o "$RUNNER_TEMP/vertrag.tar.gz"
          echo "${VERTRAG_SHA256}  $RUNNER_TEMP/vertrag.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/vertrag.tar.gz" -C "$RUNNER_TEMP" vertrag
          "$RUNNER_TEMP/vertrag" version
      - name: Prove the generated named example pairs
        env:
          OAPIFLY_VERTRAG_BINARY: ${{ runner.temp }}/vertrag
        run: go test . -run '^TestNamedExamplesWithVertrag$' -count=1 -v
